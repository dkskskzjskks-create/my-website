<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sim Companies Tracker</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f6f8;
    color:#222;
}
header{
    background:#1f2937;
    color:white;
    padding:20px;
    text-align:center;
}
.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}
.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}
input{
    width:100%;
    box-sizing:border-box;
    padding:9px;
    border:1px solid #ccc;
    border-radius:6px;
}
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:9px;
    border-bottom:1px solid #ddd;
}
th{
    background:#e5e7eb;
}
h2{
    margin-top:0;
}
</style>
</head>

<body>

<header>
<h1>Sim Companies Building Tracker</h1>
</header>

<div class="container">

<div class="card">
<h2>Today's Data</h2>

<label>Date</label>
<input type="date" id="date">

<button onclick="saveData()">Save Today's Data</button>

<p id="message"></p>
</div>

<div class="card">
<h2>Buildings</h2>

<table>
<thead>
<tr>
<th>#</th>
<th>Building</th>
<th>Quantity</th>
</tr>
</thead>

<tbody id="buildingTable"></tbody>
</table>
</div>

<div class="card">
<h2>Saved History</h2>
<div id="history"></div>
</div>

</div>

<script>

const buildings = [
["Power plant",35331],
["Farm",28744],
["Electronics factory",16767],
["Mine",16594],
["Grocery store",16578],
["Oil rig",15687],
["Factory",14497],
["Water reservoir",14194],
["Refinery",10452],
["Fashion store",8713],
["Electronics store",8057],
["Food processing plant",7278],
["Academy",6056],
["Ranch",5822],
["Beverage factory",5424],
["Hardware store",5125],
["Quarry",4727],
["Construction factory",4397],
["Mill",4279],
["Gas station",4135],
["Fashion factory",3510],
["Propulsion factory",3313],
["Sales offices",3188],
["Concrete plant",3185],
["Physics laboratory",3155],
["General contractor",3137],
["Shipping depot",3027],
["Car dealership",3021],
["Catering",2733],
["Slaughterhouse",2178],
["Restaurant",1955],
["Aerospace factory",1852],
["Forest nursery",1700],
["Lake",1678],
["Halloween market",1641],
["Car factory",1591],
["Bank",1550],
["Bakery",1500],
["Aerospace electronics",1466],
["Temple",1414],
["Kitchen",1373],
["Park",1352],
["Chemistry laboratory",1159],
["Plant research center",1142],
["Hangar",966],
["Software R&D",522],
["Vertical integration facility",463],
["Breeding laboratory",365],
["Fashion & Design",334]
];

const table=document.getElementById("buildingTable");

buildings.forEach((b,i)=>{
    const row=document.createElement("tr");

    row.innerHTML=`
        <td>${i+1}</td>
        <td>${b[0]}</td>
        <td>
            <input type="number" min="0" value="${b[1]}">
        </td>
    `;

    table.appendChild(row);
});

document.getElementById("date").value=
new Date().toISOString().split("T")[0];

function saveData(){

    const date=document.getElementById("date").value;

    if(!date){
        alert("Please select a date.");
        return;
    }

    const data=[];

    document.querySelectorAll("#buildingTable tr").forEach(row=>{

        data.push({
            building:row.children[1].innerText,
            quantity:Number(row.querySelector("input").value)||0
        });

    });

    let history=
        JSON.parse(localStorage.getItem("simCompaniesHistory")||"{}");

    history[date]=data;

    localStorage.setItem(
        "simCompaniesHistory",
        JSON.stringify(history)
    );

    document.getElementById("message").innerText=
    "Data saved successfully for "+date+"!";

    showHistory();
}

function showHistory(){

    const history=
        JSON.parse(localStorage.getItem("simCompaniesHistory")||"{}");

    const box=document.getElementById("history");

    const dates=Object.keys(history).sort().reverse();

    if(dates.length===0){
        box.innerText="No saved data yet.";
        return;
    }

    box.innerHTML=dates.map(date=>
        `<p><b>${date}</b> — ${history[date].length} buildings saved</p>`
    ).join("");
}

showHistory();

</script>

</body>
</html>
